# Cambios: RFC, aprobaciones CAB, calendario
# Responsable: Daniel
service: servidesk-changes
frameworkVersion: "3"
configValidationMode: warn   # el esquema de Serverless v3 no lista python3.12 (AWS sí lo soporta)

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  timeout: 15
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  vpc:   # RDS es privada: las Lambdas corren en la VPC (salida solo por endpoints de VPC)
    securityGroupIds: ["${param:lambdaSecurityGroupId}"]
    subnetIds: ["${param:subnetA}", "${param:subnetB}"]
  layers:
    - ${param:commonLayerArn}
  environment:
    DB_NAME: db_changes
    DB_SECRET_ARN: ${param:dbSecretArn}             # usuario/contraseña/host en Secrets Manager
    SECRETS_ENDPOINT_URL: ${param:secretsEndpointUrl}
    SNS_ENDPOINT_URL: ${param:snsEndpointUrl}
    EVENTS_TOPIC_ARN: ${param:eventsTopicArn}
    SERVICE_NAME: ms-changes
  httpApi:
    cors: true
    authorizers:
      jwtAuthorizer:
        type: request
        functionArn: ${param:authorizerArn}
        identitySource: $request.header.Authorization
        enableSimpleResponses: true
        payloadVersion: "2.0"
        resultTtlInSeconds: 300

package:
  patterns:
    - "!**"
    - "handlers/**"
    - "migrations/**"
    - "!**/__pycache__/**"

functions:
  # CH-01
  listChanges:
    handler: handlers/changes.listChanges
    events:
      - httpApi: { method: GET, path: /changes, authorizer: { name: jwtAuthorizer } }
  # CH-02
  createChange:
    handler: handlers/changes.createChange
    events:
      - httpApi: { method: POST, path: /changes, authorizer: { name: jwtAuthorizer } }
  # CH-03
  getChange:
    handler: handlers/changes.getChange
    events:
      - httpApi: { method: GET, path: "/changes/{id}", authorizer: { name: jwtAuthorizer } }
  # CH-04
  updateChange:
    handler: handlers/changes.updateChange
    events:
      - httpApi: { method: PATCH, path: "/changes/{id}", authorizer: { name: jwtAuthorizer } }
  # CH-05
  changeChangeStatus:
    handler: handlers/changes.changeChangeStatus
    events:
      - httpApi: { method: PUT, path: "/changes/{id}/status", authorizer: { name: jwtAuthorizer } }
  # CH-06
  approveChange:
    handler: handlers/changes.approveChange
    events:
      - httpApi: { method: POST, path: "/changes/{id}/approve", authorizer: { name: jwtAuthorizer } }
  # CH-07
  rejectChange:
    handler: handlers/changes.rejectChange
    events:
      - httpApi: { method: POST, path: "/changes/{id}/reject", authorizer: { name: jwtAuthorizer } }

  migrate:
    handler: handlers/migrate.handle   # se invoca a mano tras el deploy
    timeout: 300

resources:
  Resources:
    # El authorizer vive en el stack infra: API Gateway necesita permiso para invocarlo
    AuthorizerInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: ${param:authorizerArn}
        Principal: apigateway.amazonaws.com
        SourceArn: !Join ["", ["arn:aws:execute-api:", !Ref AWS::Region, ":", !Ref AWS::AccountId, ":", !Ref HttpApi, "/*"]]
