# Despliega todo con: npm run deploy   (Serverless Framework v3 + @serverless/compose)
services:
  infra:
    path: infra

  identity:
    path: services/identity
    params:
      jwtSecretArn: ${infra.JwtSecretArn}
      dbSecretArn: ${infra.DbSecretArn}
      secretsEndpointUrl: ${infra.SecretsEndpointUrl}
      snsEndpointUrl: ${infra.SnsEndpointUrl}
      lambdaSecurityGroupId: ${infra.LambdaSecurityGroupId}
      subnetA: ${infra.SubnetA}
      subnetB: ${infra.SubnetB}
      eventsTopicArn: ${infra.EventsTopicArn}
      authorizerArn: ${infra.AuthorizerArn}
      commonLayerArn: ${infra.CommonLayerArn}
      attachmentsBucket: ${infra.AttachmentsBucketName}
      exportsBucket: ${infra.ExportsBucketName}

  cmdb:
    path: services/cmdb
    params:
      dbSecretArn: ${infra.DbSecretArn}
      secretsEndpointUrl: ${infra.SecretsEndpointUrl}
      snsEndpointUrl: ${infra.SnsEndpointUrl}
